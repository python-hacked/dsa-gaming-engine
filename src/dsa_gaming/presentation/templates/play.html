{% extends "base.html" %}
{% block title %}{{ title }} · DSA Gaming Engine{% endblock %}
{% block body %}
<main class="home">
  <header class="home-bar">
    <a class="mark" href="/app/dsa">DSA Gaming Engine</a>
    <p id="clock" class="clock" data-expires="{{ expires_at }}">{{ label }} left</p>
    <div class="bar-actions">{% include "account.html" %}</div>
  </header>
  <section class="home-card play-page">
    <div class="play-layout">
      <div>
        <h1>{{ title }}</h1>
        <p class="lede" id="help"></p>
        <div id="board" data-round="{{ round_id }}" data-slug="{{ slug }}"></div>
        <p id="result" class="quiet" role="status"></p>
        <p class="again">
          <a id="submit" class="submit-btn" href="{{ next_href }}" {% if not cleared %}hidden{% endif %}>Submit</a>
          <a href="/play/{{ slug }}?new=1">New puzzle</a>
        </p>
      </div>
      <div class="editor">
        <div class="editor-bar">
          <span>{{ language_name }}</span>
          <button id="run" type="button">Run</button>
        </div>
        <textarea id="source" spellcheck="false">{{ starter }}</textarea>
      </div>
    </div>
  </section>
</main>
<script id="puzzle-data" type="application/json">{{ puzzle_json }}</script>
<script type="module" src="/static/js/games/{{ slug }}.js"></script>
{% endblock %}
